name: Hardware report
description: Tell us how the driver works on your laptop, whether it works or not.
labels: [hardware-report]
body:
  - type: markdown
    attributes:
      value: |
        Reports from different laptops show which models and firmware work, and
        how reliably. Please describe results only; do not attach fingerprint
        images or enrolled prints.
  - type: input
    id: laptop
    attributes:
      label: Laptop model
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Reader firmware
      description: The `Device firmware` line from `journalctl -b -u fprintd`, or the firmware field of `goodix-diagnose`.
      placeholder: GF3206_RTSEC_APP_10052
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Driver version and system
      description: "`pacman -Q libfprint-goodix-local` or `git describe --always`, plus distribution and desktop."
    validations:
      required: true
  - type: input
    id: port
    attributes:
      label: Reader port type
      description: Output of the command in the driver documentation's "Built-in port check" section (`fixed`, `removable` or `unknown`).
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: Enrollment
        - label: Verification (`fprintd-verify`)
        - label: Lock screen
        - label: sudo
        - label: polkit / administrator dialogs
        - label: Login screen
        - label: After suspend
        - label: After hibernate or reboot
        - label: A finger that is not enrolled is rejected
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Failures, how often a swipe is rejected or not recognized, anything unusual.
